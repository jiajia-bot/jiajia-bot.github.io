<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShuanG 爽爽绘图</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           1. OpenAI 风格视觉系统 (Design System)
           ========================================================================== */
        :root {
            --primary-blue: #0F52BA;
            --bg-light: #F9FAFB;
            --text-dark: #000000;
            --text-muted: #6E6E73;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Source Han Sans CN", sans-serif;
            
            --transition-openai: all 0.7s cubic-bezier(0.15, 0.85, 0.35, 1);
            --transition-fast: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
        }
        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            font-family: var(--font-sans);
            overflow-x: hidden;
            line-height: 1.5;
            min-height: 100vh;
        }
        /* ==========================================================================
           2. 无边界顶部导航栏
           ========================================================================== */
        .site-header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 20px 4%;
            background-color: rgba(249, 250, 251, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            position: sticky;
            top: 0;
            z-index: 100;
            transition: var(--transition-fast);
        }
        .site-header.scrolled {
            box-shadow: 0 1px 0px rgba(0, 0, 0, 0.03);
        }
        .auth-btn {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-dark);
            text-decoration: none;
            position: relative;
            justify-self: start;
            padding: 4px 0;
        }
        .auth-btn::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 1px;
            background-color: var(--text-dark);
            transition: var(--transition-fast);
        }
        .auth-btn:hover::after {
            width: 100%;
        }
        .main-title {
            text-align: center;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: -0.1px;
            color: var(--text-dark);
        }
        .main-title span {
            color: var(--primary-blue);
            font-weight: 600;
        }
        .brand-logo {
            justify-self: end;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: -0.5px;
            color: var(--text-dark);
            text-decoration: none;
            transition: var(--transition-fast);
        }
        .brand-logo:hover {
            opacity: 0.7;
        }
        /* ==========================================================================
           3. 页面主体
           ========================================================================== */
        .main-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 80px 4% 120px 4%;
        }
        .section-group {
            margin-bottom: 120px;
            opacity: 0;
            transform: translateY(40px);
            animation: openIn 1.2s cubic-bezier(0.15, 0.85, 0.35, 1) forwards;
        }
        .section-group:nth-child(2) {
            animation-delay: 0.2s;
        }
        @keyframes openIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .section-title {
            font-size: 2.2rem;
            font-weight: 500;
            letter-spacing: -1px;
            color: var(--text-dark);
            margin-bottom: 40px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(0,0,0,0.06);
        }
        .more-link {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-dark);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: var(--transition-fast);
        }
        .more-link span {
            transition: transform 0.3s ease;
        }
        .more-link:hover {
            color: var(--primary-blue);
        }
        .more-link:hover span {
            transform: translateX(4px);
        }
        .project-name {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-dark);
            margin-top: 16px;
            letter-spacing: -0.2px;
        }
        /* ==========================================================================
           4. 客户案例（右边变小）
           ========================================================================== */
        .showcase-layout {
            display: grid;
            grid-template-columns: 1.8fr 0.8fr; /* 右边变窄 */
            gap: 40px;
        }
        .showcase-main {
            display: flex;
            flex-direction: column;
        }
        .main-img-box {
            width: 100%;
            aspect-ratio: 1.7 / 1;
        }
        .main-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .showcase-side {
            display: flex;
            flex-direction: column;
            gap: 40px;
        }
        .side-item {
            display: flex;
            flex-direction: column;
        }
        .side-img-box {
            width: 100%;
            aspect-ratio: 1.3 / 1; /* 右边图片变矮一点 */
        }
        /* ==========================================================================
           5. 绘图工具
           ========================================================================== */
        .tools-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 60px;
            row-gap: 50px;
        }
        .tool-card {
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 24px;
            align-items: flex-start;
        }
        .tool-img-box {
            width: 160px;
            height: 145px;
        }
        .tool-desc {
            font-size: 15px;
            color: var(--text-muted);
            text-align: left;
            line-height: 1.6;
            font-weight: 400;
            padding-top: 4px;
        }
        .tools-footer {
            text-align: left;
            margin-top: 50px;
        }
        /* ==========================================================================
           6. 图片样式
           ========================================================================== */
        .image-wrapper {
            position: relative;
            border-radius: 0px;
            overflow: hidden;
            background-color: #eaeaea;
            cursor: pointer;
            transition: var(--transition-openai);
        }
        .art-image {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 500;
            letter-spacing: 0.5px;
            background-blend-mode: overlay;
            transition: var(--transition-openai);
        }
        .image-wrapper:hover {
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.08);
        }
        .image-wrapper:hover .art-image {
            transform: scale(1.04);
            filter: brightness(1.05);
        }
        .bg-case-main { background: linear-gradient(135deg, #030a16 0%, #0F52BA 100%); }
        .bg-side-1    { background: linear-gradient(135deg, #1e293b 0%, #475569 100%); }
        .bg-side-2    { background: linear-gradient(135deg, #0F52BA 0%, #cbd5e1 100%); }
        
        .bg-tool-1    { background: linear-gradient(135deg, #030a16 0%, #334155 100%); }
        .bg-tool-2    { background: linear-gradient(135deg, #0F52BA 0%, #1e293b 100%); }
        .bg-tool-3    { background: linear-gradient(135deg, #64748B 0%, #f1f5f9 100%); }
        .bg-tool-4    { background: linear-gradient(135deg, #94a3b8 0%, #030a16 100%); }
        .bg-tool-5    { background: linear-gradient(135deg, #0F52BA 0%, #64748B 100%); }
        .bg-tool-6    { background: linear-gradient(135deg, #475569 0%, #f8fafc 100%); }
        /* ==========================================================================
           7. 页脚
           ========================================================================== */
        .site-footer {
            background-color: #000000;
            color: #ffffff;
            padding: 80px 4%;
            text-align: left;
        }
        .footer-wrap {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }
        .footer-info {
            font-size: 14px;
            color: #86868b;
        }
        .footer-links {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }
        .footer-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 400;
            transition: var(--transition-fast);
        }
        .footer-links a:hover {
            color: var(--primary-blue);
        }
        /* ==========================================================================
           8. 响应式
           ========================================================================== */
        @media (max-width: 1024px) {
            .section-title { font-size: 1.8rem; }
            .showcase-layout { grid-template-columns: 1fr; gap: 50px; }
            .tools-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 768px) {
            .site-header { grid-template-columns: 1fr 1fr; }
            .main-title { display: none; }
            .tool-card { grid-template-columns: 120px 1fr; }
            .tool-img-box { width: 120px; height: 110px; }
        }
    </style>
</head>
<body>

    </main>
    <footer class="site-footer">

    <script>
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 20) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });
    </script>
</body>
</html>
