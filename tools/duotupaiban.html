<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Shuangshuang · 多图画册</title>
  <style>
    :root{--ink:#171717;--paper:#fff;--soft:#f1f1f1;--line:#e5e5e5;--accent:#ffe600}
    *{box-sizing:border-box} body{margin:0;background:#111;color:var(--ink);font-family:Arial,"Microsoft YaHei",sans-serif}
    button,input,textarea{font:inherit}button{border:0;cursor:pointer}.app{min-height:100dvh;background:#f2f3f5;overflow:hidden}
    header{height:66px;padding:12px 5vw;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line)}
    .brand{font-size:21px;font-weight:900;letter-spacing:-1px}.brand i{font-style:normal;color:#777;font-weight:400;font-size:12px;margin-left:7px;letter-spacing:0}
    .top-actions,.tool-actions{display:flex;gap:8px}.btn{background:var(--ink);color:#fff;border-radius:12px;padding:11px 15px;font-size:13px;font-weight:700}.btn.light{background:#eee;color:#222}.btn.yellow{background:var(--accent);color:#111}.icon{width:42px;height:42px;border-radius:13px;background:#fff;border:1px solid var(--line);font-size:19px}
    main{max-width:1400px;margin:auto;padding:28px 5vw 110px}.empty{min-height:70dvh;display:grid;place-items:center;text-align:center}.empty h1{font-size:clamp(32px,6vw,64px);margin:0 0 12px;letter-spacing:-3px}.empty p{color:#777;margin:0 0 25px}.drop{width:min(600px,95vw);padding:46px 20px;border:2px dashed #cfcfcf;border-radius:25px;background:#fff;transition:.2s}.drop.drag{border-color:#111;background:#fffde0}.drop strong{font-size:18px;display:block;margin:12px}.drop small{color:#888}.file{display:none}
    #workspace{display:none;grid-template-columns:210px 1fr 250px;gap:20px;align-items:start}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px}.panel h3{font-size:13px;margin:3px 0 13px}.pages{display:grid;gap:9px;max-height:72dvh;overflow:auto;padding-right:3px}.thumb{position:relative;background:#eee;border:2px solid transparent;border-radius:10px;aspect-ratio:1/1.22;overflow:hidden;cursor:pointer}.thumb.active{border-color:#111}.thumb .n{position:absolute;bottom:3px;right:6px;background:#111;color:#fff;padding:2px 5px;border-radius:5px;font-size:10px}.thumbPreview{width:100%;height:100%;transform:scale(.22);transform-origin:top left;width:454%;height:454%;pointer-events:none}
    .stage-wrap{min-width:0}.stage-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.stage-toolbar span{font-size:13px;color:#777}.stage{width:min(100%,720px);margin:auto;aspect-ratio:1/1.22;background:white;box-shadow:0 16px 45px #0002;position:relative;overflow:hidden;border-radius:4px}.canvas{width:100%;height:100%;position:relative;overflow:hidden}.photo{position:absolute;overflow:hidden;background:#ddd;cursor:move;touch-action:none;user-select:none}.photo img{position:absolute;width:100%;height:100%;object-fit:cover;transform-origin:center;pointer-events:none}.photo.selected{outline:3px solid #ef52e8;z-index:10}.photo.selected:after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:#111;border:2px solid white;right:-7px;top:-7px;cursor:nesw-resize}.caption{position:absolute;left:8%;right:8%;bottom:7%;text-align:center;font-weight:800;font-size:clamp(13px,2.2vw,23px);outline:none;z-index:15}.caption:focus{outline:2px dashed #555}.page-no{position:absolute;right:5%;bottom:3%;font-size:10px;font-weight:bold}.credit{position:absolute;bottom:3%;left:5%;font-size:8px;color:#555}
    .control{margin-bottom:16px}.control label{display:block;font-size:12px;color:#555;margin:0 0 7px}.layouts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.layout{aspect-ratio:1;background:#f1f1f1;border:2px solid transparent;border-radius:9px;padding:5px;display:grid;gap:3px}.layout.active{border-color:#111}.layout b{background:#999;display:block}.row{display:flex;gap:7px;align-items:center}.row input[type="color"]{width:42px;height:36px;padding:2px;border:0;background:none}.row input[type="range"]{width:100%}textarea{width:100%;resize:vertical;min-height:75px;border:1px solid var(--line);border-radius:10px;padding:10px}.danger{color:#c33;background:#fff0f0}.mobilebar{display:none}
    .modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:100;padding:20px}.modal.show{display:flex}.dialog{width:min(540px,100%);background:#fff;border-radius:24px;padding:25px}.dialog h2{margin:0 0 7px}.dialog p{color:#777;font-size:13px}.dialog .layouts{grid-template-columns:repeat(4,1fr);margin:20px 0}.dialog .layout{height:90px}
    .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(100px);background:#111;color:white;padding:11px 17px;border-radius:99px;font-size:13px;transition:.25s;z-index:200}.toast.show{transform:translateX(-50%) translateY(0)}
    @media(max-width:850px){header{height:60px;padding:9px 15px}.brand i,.hide-mobile{display:none}main{padding:13px 12px 85px}#workspace{grid-template-columns:1fr;gap:10px}.leftpanel,.rightpanel{display:none}.stage-toolbar{padding:0 3px}.stage{width:100%;max-height:calc(100dvh - 190px)}.mobilebar{position:fixed;display:flex;bottom:0;left:0;right:0;height:71px;background:#fff;border-top:1px solid var(--line);z-index:30;justify-content:space-around;align-items:center}.mobilebar button{background:none;font-size:11px}.mobilebar b{display:block;font-size:22px;margin-bottom:3px}.top-actions .btn{padding:10px}.empty h1{letter-spacing:-2px}}
    @media print{body{background:#fff}.app>header,.leftpanel,.rightpanel,.stage-toolbar,.mobilebar,.toast{display:none!important}.app,main,#workspace,.stage-wrap{display:block!important;padding:0!important;margin:0!important}.stage{break-after:page;width:100vw;height:100vh;max-width:none;box-shadow:none;page-break-after:always}.stage:not(.print-page){display:none!important}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">Shuangshuang <i>多图画册编辑器</i></div>
    <div class="top-actions">
      <button class="btn light hide-mobile" onclick="newAlbum()">新建画册</button>
      <button class="btn" onclick="exportPDF()">导出 PDF</button>
    </div>
  </header>
  <main>
    <section class="empty" id="empty">
      <div>
        <h1>把照片，排成一本画册。</h1><p>上传照片，自动生成多页排版；所有内容只保存在你的浏览器中。</p>
        <div class="drop" id="drop"><div style="font-size:42px">＋</div><strong>选择多张图片</strong><small>支持 JPG、PNG、WebP；可一次上传多张</small><br><br><button class="btn yellow" onclick="picker.click()">上传图片开始</button></div>
        <input class="file" id="picker" type="file" accept="image/*" multiple />
      </div>
    </section>
    <section id="workspace">
      <aside class="panel leftpanel"><h3>页面 <button class="icon" style="float:right;width:28px;height:28px;font-size:18px" onclick="addPage()">＋</button></h3><div class="pages" id="pages"></div></aside>
      <div class="stage-wrap"><div class="stage-toolbar"><span id="pageInfo">第 1 页</span><div class="tool-actions"><button class="icon" title="添加页面" onclick="addPage()">＋</button><button class="icon" title="删除页面" onclick="removePage()">⌫</button><button class="icon" title="保存" onclick="save()">♡</button></div></div><div class="stage" id="stage"><div class="canvas" id="canvas"></div></div></div>
      <aside class="panel rightpanel">
        <div class="control"><h3>图片排版</h3><div class="layouts" id="layoutChoices"></div></div>
        <div class="control"><label>页面背景</label><div class="row"><input type="color" id="bg" value="#ffffff"><button class="btn light" onclick="randomBg()">随机颜色</button></div></div>
        <div class="control"><label>页面文字（点击画布文字也可直接修改）</label><textarea id="captionInput" placeholder="输入这一页的文字…"></textarea></div>
        <div class="control"><label>选中图片缩放</label><input id="zoom" type="range" min="0.5" max="2.5" step="0.01" value="1"></div>
        <div class="control"><button class="btn light" style="width:100%" onclick="picker.click()">＋ 添加素材</button></div>
        <div class="control"><button class="btn danger" style="width:100%" onclick="removeSelectedPhoto()">删除选中图片</button></div>
      </aside>
    </section>
  </main>
  <nav class="mobilebar" id="mobilebar"><button onclick="picker.click()"><b>▧</b>素材</button><button onclick="openLayoutModal()"><b>▦</b>排版</button><button onclick="editCaption()"><b>T</b>文字</button><button onclick="addPage()"><b>＋</b>加页</button><button onclick="exportPDF()"><b>⇧</b>导出</button></nav>
</div>
<div class="modal" id="layoutModal"><div class="dialog"><button class="icon" style="float:right" onclick="closeModal()">×</button><h2>编辑排版</h2><p>选择当前页面的图片布局</p><div class="layouts" id="modalLayouts"></div><label>背景颜色　<input type="color" id="modalBg" value="#ffffff"></label></div></div>
<div class="toast" id="toast"></div>
<script>
const layouts={
  hero:[['0,0,100,100']], two:[['0,0,50,100'],['50,0,50,100']], split:[['0,0,68,100'],['68,0,32,33.33'],['68,33.33,32,33.33'],['68,66.66,32,33.34']],
  grid4:[['0,0,50,50'],['50,0,50,50'],['0,50,50,50'],['50,50,50,50']], collage:[['0,0,65,60'],['65,0,35,30'],['65,30,35,30'],['0,60,35,40'],['35,60,65,40']], strips:[['0,0,100,33.33'],['0,33.33,100,33.33'],['0,66.66,100,33.34']]
};
let album={pages:[],assets:[]}, current=0, selected=null;
const picker=document.querySelector('#picker'),canvas=document.querySelector('#canvas'),pagesEl=document.querySelector('#pages'),toastEl=document.querySelector('#toast');
function uid(){return Math.random().toString(36).slice(2)}
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),1800)}
function readFiles(files){let list=[...files].filter(f=>f.type.startsWith('image/'));if(!list.length)return;Promise.all(list.map(f=>new Promise(r=>{let fr=new FileReader;fr.onload=e=>r({id:uid(),src:e.target.result,name:f.name});fr.readAsDataURL(f)}))).then(a=>{album.assets.push(...a);if(!album.pages.length){album.pages.push(makePage(a.slice(0,5)));document.querySelector('#empty').style.display='none';document.querySelector('#workspace').style.display='grid'}else{album.pages[current].photos.push(...a.map(x=>({assetId:x.id,x:0,y:0,scale:1})));applyLayout(album.pages[current], album.pages[current].layout)}render();save();toast(`已加入 ${a.length} 张图片`)})}
picker.addEventListener('change',e=>{readFiles(e.target.files);picker.value=''});const drop=document.querySelector('#drop');['dragover','dragleave','drop'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.toggle('drag',n==='dragover')}));drop.addEventListener('drop',e=>readFiles(e.dataTransfer.files));
function makePage(assets=[]){let p={id:uid(),layout:assets.length>1?'split':'hero',bg:'#ffffff',caption:'',photos:assets.map(a=>({assetId:a.id,x:0,y:0,scale:1}))};return p}
function page(){return album.pages[current]}; function asset(id){return album.assets.find(a=>a.id===id)}
function layoutMarkup(key){let cells=layouts[key],html='';cells.forEach((c,i)=>{let[a,b,w,h]=c[0].split(',').map(Number);html+=`<b style="grid-area:auto;clip-path:inset(${b}% ${100-a-w}% ${100-b-h}% ${a}%);position:absolute;inset:0"></b>`});return `<button class="layout ${page()?.layout===key?'active':''}" data-layout="${key}" style="position:relative">${html}</button>`}
function drawLayouts(){let html=Object.keys(layouts).map(layoutMarkup).join('');document.querySelector('#layoutChoices').innerHTML=html;document.querySelector('#modalLayouts').innerHTML=html;document.querySelectorAll('[data-layout]').forEach(b=>b.onclick=()=>{applyLayout(page(),b.dataset.layout);render();closeModal()})}
function applyLayout(p,key){p.layout=key;let cells=layouts[key];p.photos=p.photos.slice(0,cells.length);while(p.photos.length<cells.length&&album.assets.length){let used=p.photos.map(x=>x.assetId), a=album.assets.find(x=>!used.includes(x.id))||album.assets[p.photos.length%album.assets.length];p.photos.push({assetId:a.id,x:0,y:0,scale:1})}}
function render(){if(!album.pages.length)return;let p=page();document.querySelector('#pageInfo').textContent=`第 ${current+1} 页 / 共 ${album.pages.length} 页`;canvas.style.background=p.bg;document.querySelector('#bg').value=p.bg;document.querySelector('#captionInput').value=p.caption;drawLayouts();selected=null;let cells=layouts[p.layout];canvas.innerHTML='';p.photos.forEach((ph,i)=>{let c=cells[i];if(!c)return;let [x,y,w,h]=c[0].split(',').map(Number),a=asset(ph.assetId);if(!a)return;let el=document.createElement('div');el.className='photo';el.dataset.index=i;el.style.cssText=`left:${x}%;top:${y}%;width:${w}%;height:${h}%;`;el.innerHTML=`<img src="${a.src}" style="transform:translate(${ph.x}px,${ph.y}px) scale(${ph.scale})">`;el.onclick=e=>{e.stopPropagation();selectPhoto(i)};bindDrag(el,i);canvas.append(el)});let cap=document.createElement('div');cap.className='caption';cap.contentEditable=true;cap.textContent=p.caption||'点击添加文字';cap.oninput=()=>{p.caption=cap.textContent==='点击添加文字'?'':cap.textContent;document.querySelector('#captionInput').value=p.caption;save()};canvas.append(cap);let credit=document.createElement('span');credit.className='credit';credit.textContent='Designed by Shuangshuang';canvas.append(credit);let no=document.createElement('span');no.className='page-no';no.textContent=`(${String(current+1).padStart(2,'0')})`;canvas.append(no);renderPages()}
function selectPhoto(i){selected=i;document.querySelectorAll('.photo').forEach((e,n)=>e.classList.toggle('selected',n===i));document.querySelector('#zoom').value=page().photos[i].scale}
function bindDrag(el,i){let start,move;el.addEventListener('pointerdown',e=>{start={x:e.clientX,y:e.clientY,px:page().photos[i].x,py:page().photos[i].y};el.setPointerCapture(e.pointerId);selectPhoto(i);move=e=>{let ph=page().photos[i];ph.x=start.px+e.clientX-start.x;ph.y=start.py+e.clientY-start.y;el.querySelector('img').style.transform=`translate(${ph.x}px,${ph.y}px) scale(${ph.scale})`};el.addEventListener('pointermove',move)});el.addEventListener('pointerup',()=>{el.removeEventListener('pointermove',move);save()})}
function renderPages(){pagesEl.innerHTML=album.pages.map((p,i)=>`<div class="thumb ${i===current?'active':''}" onclick="goPage(${i})"><div class="thumbPreview" style="background:${p.bg}">${p.photos.slice(0,5).map((ph,n)=>{let a=asset(ph.assetId),c=layouts[p.layout][n];if(!a||!c)return'';let[x,y,w,h]=c[0].split(',').map(Number);return `<img src="${a.src}" style="position:absolute;object-fit:cover;left:${x}%;top:${y}%;width:${w}%;height:${h}%">`}).join('')}</div><span class="n">${i+1}</span></div>`).join('')}
function goPage(i){current=i;render()} function addPage(){album.pages.push(makePage(album.assets.slice(0,5)));current=album.pages.length-1;render();save()}function removePage(){if(album.pages.length<2)return toast('至少保留一页');album.pages.splice(current,1);current=Math.max(0,current-1);render();save()}
function removeSelectedPhoto(){if(selected===null)return toast('请先点击要删除的图片');page().photos.splice(selected,1);applyLayout(page(),page().layout);render();save()}
document.querySelector('#bg').oninput=e=>{page().bg=e.target.value;render();save()};document.querySelector('#captionInput').oninput=e=>{page().caption=e.target.value;render();save()};document.querySelector('#zoom').oninput=e=>{if(selected===null)return;page().photos[selected].scale=+e.target.value;let im=document.querySelector(`.photo[data-index="${selected}"] img`),p=page().photos[selected];im.style.transform=`translate(${p.x}px,${p.y}px) scale(${p.scale})`;save()};
function randomBg(){page().bg=['#ffffff','#ffe817','#ec75f1','#238ce5','#0b7355','#f5eddf'][Math.floor(Math.random()*6)];render();save()}function newAlbum(){if(confirm('新建画册会清空当前内容，确定吗？')){album={pages:[],assets:[]};current=0;localStorage.removeItem('flipinAlbum');document.querySelector('#empty').style.display='grid';document.querySelector('#workspace').style.display='none'}}
function openLayoutModal(){document.querySelector('#layoutModal').classList.add('show');document.querySelector('#modalBg').value=page().bg}function closeModal(){document.querySelector('#layoutModal').classList.remove('show')}document.querySelector('#modalBg').oninput=e=>{page().bg=e.target.value;render()};function editCaption(){let v=prompt('输入页面文字：',page().caption);if(v!==null){page().caption=v;render();save()}}
function save(){try{localStorage.setItem('flipinAlbum',JSON.stringify(album))}catch(e){toast('图片过多，浏览器存储空间不足')}}function exportPDF(){document.querySelectorAll('.stage').forEach(x=>x.remove());let holder=document.querySelector('.stage-wrap');album.pages.forEach((p,i)=>{let d=document.createElement('div');d.className='stage print-page';d.innerHTML='<div class="canvas"></div>';holder.append(d);let old=current;current=i;let target=d.querySelector('.canvas');target.style.background=p.bg;let cells=layouts[p.layout];p.photos.forEach((ph,n)=>{let a=asset(ph.assetId),c=cells[n];if(!a)return;let[x,y,w,h]=c[0].split(',').map(Number);target.innerHTML+=`<div class="photo" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%"><img src="${a.src}" style="transform:translate(${ph.x}px,${ph.y}px) scale(${ph.scale})"></div>`});target.innerHTML+=`<div class="caption">${p.caption}</div><span class="credit">Designed by FLIPIN</span><span class="page-no">(${String(i+1).padStart(2,'0')})</span>`;current=old});window.print();setTimeout(()=>{document.querySelectorAll('.print-page').forEach(x=>x.remove());let st=document.createElement('div');st.className='stage';st.id='stage';st.innerHTML='<div class="canvas" id="canvas"></div>';holder.append(st);location.reload()},500)}
try{let saved=JSON.parse(localStorage.getItem('flipinAlbum'));if(saved?.pages?.length){album=saved;document.querySelector('#empty').style.display='none';document.querySelector('#workspace').style.display='grid';render()}}catch(e){}
</script>
</body>
</html>
