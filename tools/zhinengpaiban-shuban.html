<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>智能网格排版器</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 自定义配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'soft-bg': '#ffffff',
                        'card-light': '#ffffff',
                        'border-light': '#eae6df',
                        'text-soft': '#2b2a28',
                        'accent-blue': '＃0000CD',
                        'accent-soft': '#ffedd5',
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts 无衬线体 + 复古等宽 -->
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,800&display=swap" rel="stylesheet">
    <!-- html-to-image -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'SimHei', system-ui, sans-serif; background: #f2efe9; }
        .poster-canvas {
            width: 750px;
            height: 1000px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.12);
            transition: background-color 0.2s ease;
            border-radius: 0px;
        }
        .typewriter-font { font-family: 'Courier Prime', monospace; }
        .vertical-text { writing-mode: vertical-rl; text-orientation: mixed; }
        .control-panel::-webkit-scrollbar { width: 4px; }
        .control-panel::-webkit-scrollbar-track { background: #e7e2d9; border-radius: 6px; }
        .control-panel::-webkit-scrollbar-thumb { background: #c0b7a8; border-radius: 6px; }
        .soft-card { background-color: #ffffff; border: 1px solid #eee9e2; box-shadow: 0 1px 2px rgba(0,0,0,0.02); }
        input:focus, textarea:focus {
            outline: none;
            border-color: #f97316 !important;
            box-shadow: 0 0 0 2px rgba(249,115,22,0.1);
        }
        .btn-soft { background: #f5f3ef; border: 1px solid #e2dcd3; color: #3a3732; }
        .btn-soft:hover { background: #ffffff; border-color: #f97316; color: white; }
        .toast-msg {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #2b2a28; color: white; padding: 6px 14px; border-radius: 40px;
            font-size: 12px; z-index: 999; pointer-events: none; opacity: 0;
            transition: opacity 0.2s; font-family: monospace;
        }
    </style>
</head>
<body class="p-5 md:p-6 min-h-screen flex flex-col items-center bg-[#f2efe9]">

    <div class="toast-msg" id="toastMsg">✨ 操作成功</div>

    <header class="text-center mb-6">
        <div class="flex items-center justify-center gap-2 text-3xl font-black tracking-tight text-stone-800">
            <span>爽爽排版</span>
            <span class="text-orange-500">· 随便排都好看</span>
        </div>
    </header>

    <div class="w-full max-w-7xl grid grid-cols-1 xl:grid-cols-12 gap-6 items-start">
        
        <!-- 左侧控制面板 -->
        <div class="xl:col-span-5 bg-white rounded-2xl border border-stone-200 p-5 space-y-5 overflow-y-auto max-h-[90vh] control-panel shadow-sm">
            
            <!-- 1. 网格识别区 -->
            <div class="bg-stone-50/80 rounded-xl p-4 border border-stone-200/80 space-y-4">
                <div class="flex items-center justify-between">
                    <h2 class="text-sm font-semibold text-stone-700 flex items-center gap-2">1. 上传参考图 · 提取网格</h2>
                    <span id="grid-status-badge" class="bg-stone-100 text-stone-600 text-[10px] px-2 py-0.5 rounded-full font-mono">待上传</span>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <div onclick="document.getElementById('ref-uploader').click()" class="border border-dashed border-stone-300 hover:border-orange-400 rounded-xl p-3 text-center cursor-pointer transition bg-white/80">
                            <input type="file" id="ref-uploader" accept="image/*" class="hidden">
                            <span class="text-2xl block">🖼️</span>
                            <span class="text-[11px] font-medium text-stone-500">上传版式参考图</span>
                        </div>
                        <div>
                            <div class="flex justify-between text-[11px] text-stone-500 mb-1"><span>敏感度</span><span id="val-sens" class="text-orange-600 font-mono">60%</span></div>
                            <input type="range" id="slider-sens" min="10" max="90" step="5" value="60" disabled class="w-full h-1.5 bg-stone-200 rounded accent-orange-500">
                        </div>
                    </div>
                    <div class="bg-stone-100 rounded-xl flex items-center justify-center overflow-hidden border border-stone-200 relative h-28">
                        <canvas id="ref-canvas" class="max-w-full max-h-full object-contain block"></canvas>
                        <span id="ref-placeholder" class="text-stone-400 text-[10px] absolute">网格线预览</span>
                    </div>
                </div>
            </div>

            <!-- 2. 素材 & 底色 -->
            <div class="bg-stone-50/80 rounded-xl p-4 border border-stone-200/80 space-y-3">
                <h3 class="text-sm font-semibold text-stone-700"> 2. 上传素材 & 底色调整</h3>
                <div class="flex flex-wrap items-center gap-3">
                    <button id="uploadImgBtn" class="bg-white border border-stone-300 text-stone-700 font-medium py-1.5 px-4 rounded-lg text-xs shadow-sm hover:border-orange-400">🍎 上传苹果照片 (多选)</button>
                    <input type="file" id="material-uploader" accept="image/*" multiple hidden>
                    <span id="material-count" class="text-xs text-stone-500">预设图片</span>
                    <button id="resetMaterialBtn" class="text-xs bg-stone-100 border border-stone-200 px-2 py-1 rounded-full hover:bg-orange-50 transition"> 重置预设</button>
                    <label class="flex items-center gap-1.5 text-xs text-stone-600 bg-white px-2 py-1 rounded-full border"><input type="checkbox" id="toggle-grayscale" checked class="accent-orange-500 w-3.5 h-3.5"> 灰度质感</label>
                    <label class="flex items-center gap-1.5 text-xs text-stone-600 bg-white px-2 py-1 rounded-full border"><input type="checkbox" id="toggle-grid" checked class="accent-orange-500 w-3.5 h-3.5"> 显示辅助线</label>
                </div>
                <!-- 底色控件 -->
                <div class="flex items-center gap-3 bg-white p-2 rounded-lg border border-stone-200">
                    <span class="text-xs font-medium text-stone-600"> 画布底色</span>
                    <input type="color" id="bg-color-picker" value="#faf4e6" class="w-7 h-7 rounded border border-stone-300 cursor-pointer">
                    <input type="text" id="bg-hex-input" value="#faf4e6" placeholder="#HEX" class="flex-1 text-xs border border-stone-200 rounded px-2 py-1.5 font-mono bg-stone-50">
                    <button id="apply-bg-btn" class="text-xs bg-stone-100 px-3 py-1.5 rounded border border-stone-200 hover:bg-orange-50 transition">应用</button>
                </div>
            </div>

            <!-- 3. 文字与字号调节 -->
            <div class="bg-stone-50/80 rounded-xl p-4 border border-stone-200/80 space-y-3">
                <h1 class="text-sm font-semibold text-stone-700">3. 文案</h1>
                <div class="space-y-3">
                    <div><div class="flex justify-between text-xs"><span>主标题</span><span id="title-size-val" class="text-orange-600 text-[10px] font-mono">56px</span></div>
                    <div class="flex gap-2"><input type="text" id="input-title" value="蜜脆苹果·秋实" class="flex-1 bg-white border border-stone-300 rounded-lg p-2 text-sm text-stone-800 font-medium"><input type="range" id="title-font-size" min="24" max="96" step="2" value="56" class="w-28 accent-orange-500"></div></div>
                    <div><div class="flex justify-between text-xs"><span>副标题</span><span id="subtitle-size-val" class="text-orange-600 text-[10px] font-mono">18px</span></div>
                    <div class="flex gap-2"><input type="text" id="input-subtitle" value="2026 HARVEST · 脆甜当季" class="flex-1 bg-white border border-stone-300 rounded-lg p-2 text-xs"><input type="range" id="subtitle-font-size" min="10" max="48" step="1" value="18" class="w-28 accent-orange-500"></div></div>
                    <div><div class="flex justify-between text-xs"><span>正文</span><span id="body-size-val" class="text-orange-600 text-[10px] font-mono">11px</span></div>
                    <textarea id="input-body" rows="2" class="w-full bg-white border border-stone-300 rounded-lg p-2 text-xs">红彤彤的苹果挂满枝头，空气中弥漫着清甜芬芳。每一口都是阳光与自然的馈赠，从果园直达心间，酥脆多汁，回味无穷。</textarea>
                    <input type="range" id="body-font-size" min="8" max="28" step="1" value="11" class="w-full mt-1 accent-orange-500"></div>
                    <div><label class="text-xs text-stone-600 block">辅助标签 (每行一个)</label>
                    <textarea id="input-aux" rows="2" class="w-full bg-white border border-stone-300 rounded-lg p-2 text-xs font-mono">🍎 自然熟\n🍏 脆甜爽口\n🍎 原产地直供</textarea>
                    <div class="flex justify-between mt-1"><span class="text-[10px] text-stone-500">标签字号</span><input type="range" id="aux-font-size" min="8" max="28" step="1" value="10" class="w-32 accent-orange-500"></div></div>
                </div>
            </div>

            <!-- 4. 图片缩放 -->
            <div class="bg-stone-50/80 rounded-xl p-4 border border-stone-200/80 space-y-2">
                <div class="flex justify-between items-center"><h3 class="text-sm font-semibold text-stone-700">🖼️ 图片缩放比例</h3><span id="img-scale-val" class="text-orange-600 font-mono text-sm">100%</span></div>
                <input type="range" id="image-scale-slider" min="40" max="180" step="5" value="100" class="w-full accent-orange-500">
            </div>

            <!-- 5. 布局种子 & 导出 -->
            <div class="pt-2 space-y-4">
                <div><div class="flex justify-between text-xs text-stone-600 mb-1"><span>🎲 非对称布局种子</span><span id="seed-val" class="text-orange-600 font-mono font-bold">256</span></div>
                <input type="range" id="slider-seed" min="1" max="999" step="1" value="256" class="w-full h-1.5 bg-stone-200 rounded accent-orange-500"></div>
                <div class="flex gap-3"><button onclick="randomizeSeed()" class="flex-1 bg-white border border-stone-300 hover:border-orange-400 text-stone-700 font-medium py-2 rounded-xl text-xs transition">🎲 随机布局</button><button onclick="exportPoster()" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 rounded-xl shadow-sm text-sm transition">⬇️ 导出 PNG</button></div>
                <button onclick="resetToDefault()" class="w-full text-stone-500 border border-stone-200 rounded-xl py-1.5 text-xs hover:bg-stone-100 transition">⟳ 重置所有参数 (含苹果预设)</button>
            </div>
        </div>

        <!-- 右侧海报画布 -->
        <div class="xl:col-span-7 flex flex-col items-center justify-start p-3 bg-white/60 rounded-2xl border border-stone-200 shadow-sm">
            <div class="relative flex justify-center overflow-x-auto rounded-lg">
                <div id="poster-root" class="poster-canvas origin-top">
                    <div id="dynamic-bg-layer" class="absolute inset-0 w-full h-full" style="background-color: #faf4e6; z-index: 0;"></div>
                    <div id="grid-helper-layer" class="absolute inset-0 z-30 pointer-events-none"></div>
                    <div id="poster-content" class="absolute inset-0 z-10"></div>
                </div>
            </div>
            <p class="text-stone-400 text-[10px] mt-3 text-center">⚡ AI智能网格 + 苹果主题素材 | 上传本地水果图片即可替换</p>
        </div>
    </div>

    <script>
        // ---------- 全局变量 ----------
        let uploadedMaterials = [];            // 用户上传图片 base64 / 本地blob url
        let referenceImg = null;         
        let gridXCoords = [0, 150, 300, 450, 600, 750];
        let gridYCoords = [0, 166.6, 333.3, 500, 666.6, 833.3, 1000];
        const accentColors = ["#f5b041", "#00a2e8", "#27ae60", "#e74c3c", "#9b59b6", "#e67e22"];
        
        // 🍎 全新苹果主题预设 (支持跨域的高质量水果图片)
        const APPLE_PRESETS = [
            "https://plus.unsplash.com/premium_photo-1724249990837-f6dfcb7f3eaa?q=80&w=774&auto=format",
            "https://images.unsplash.com/photo-1678942946279-c83e37f32304?q=80&w=1160&auto=format",
            "https://images.unsplash.com/photo-1611574474484-ced6cb70a2cf?q=80&w=1740&auto=format",
            "https://images.unsplash.com/photo-1586671267731-da2cf3ceeb80?q=80&w=778&auto=format"
        ];
        
        // 当前使用的素材源 (默认苹果预设)
        let activeImageSources = [...APPLE_PRESETS];

        let typoSizes = { title: 56, subtitle: 18, body: 11, aux: 10 };
        let globalImageScale = 100;

        // 简易提示
        function showMessage(msg, isError = false) {
            const toast = document.getElementById('toastMsg');
            toast.textContent = msg;
            toast.style.background = isError ? '#c2410c' : '#2b2a28';
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 2000);
        }

        // 随机函数
        function mulberry32(a) {
            return function() { var t = a += 0x6D2B79F5; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        }

        function randomizeSeed() {
            const randomVal = Math.floor(Math.random() * 999) + 1;
            document.getElementById('slider-seed').value = randomVal;
            document.getElementById('seed-val').innerText = randomVal;
            generateLayout();
            drawGridLines();
            showMessage(`🎲 新种子: ${randomVal}`);
        }

        // 重置苹果预设素材 (清空上传库, 恢复默认苹果图片)
        function resetToApplePreset() {
            uploadedMaterials = [];
            activeImageSources = [...APPLE_PRESETS];
            document.getElementById('material-count').innerText = `${activeImageSources.length}张苹果预设`;
            showMessage(`🍎 已恢复4张苹果主题预设图片`);
            generateLayout();
        }

        // 重置全部参数
        function resetToDefault() {
            document.getElementById('slider-seed').value = '256';
            document.getElementById('seed-val').innerText = '256';
            document.getElementById('input-title').value = '蜜脆苹果·秋实';
            document.getElementById('input-subtitle').value = '2026 HARVEST · 脆甜当季';
            document.getElementById('input-body').value = '红彤彤的苹果挂满枝头，空气中弥漫着清甜芬芳。每一口都是阳光与自然的馈赠，从果园直达心间，酥脆多汁，回味无穷。';
            document.getElementById('input-aux').value = '🍎 自然熟\n🍏 脆甜爽口\n🍎 原产地直供';
            document.getElementById('title-font-size').value = '56';
            document.getElementById('subtitle-font-size').value = '18';
            document.getElementById('body-font-size').value = '11';
            document.getElementById('aux-font-size').value = '10';
            document.getElementById('image-scale-slider').value = '100';
            document.getElementById('bg-color-picker').value = '#ffffff';
            document.getElementById('bg-hex-input').value = '#ffffff';
            document.getElementById('toggle-grayscale').checked = true;
            document.getElementById('toggle-grid').checked = true;
            typoSizes = { title:56, subtitle:18, body:11, aux:10 };
            globalImageScale = 100;
            updateSizeLabels();
            applyBackgroundColor('#ffffff');
            // 重置素材库为苹果预设
            uploadedMaterials = [];
            activeImageSources = [...APPLE_PRESETS];
            document.getElementById('material-count').innerText = `${activeImageSources.length}张苹果预设`;
            generateLayout();
            drawGridLines();
            showMessage(`⟳ 重置全部参数 & 苹果主题`);
        }

        function updateSizeLabels() {
            document.getElementById('title-size-val').innerText = typoSizes.title + 'px';
            document.getElementById('subtitle-size-val').innerText = typoSizes.subtitle + 'px';
            document.getElementById('body-size-val').innerText = typoSizes.body + 'px';
            document.getElementById('aux-font-size').value = typoSizes.aux;
            document.getElementById('img-scale-val').innerText = globalImageScale + '%';
        }

        function applyBackgroundColor(hexColor) {
            const bgLayer = document.getElementById('dynamic-bg-layer');
            if(bgLayer) bgLayer.style.backgroundColor = hexColor;
        }
        document.getElementById('apply-bg-btn').addEventListener('click', () => {
            let hex = document.getElementById('bg-hex-input').value.trim();
            if(!hex.startsWith('#')) hex = '#' + hex;
            if(/^#[0-9A-F]{6}$/i.test(hex) || hex.length===7) {
                document.getElementById('bg-color-picker').value = hex;
                applyBackgroundColor(hex);
                generateLayout();
            } else showMessage("请输入有效十六进制色值", true);
        });
        document.getElementById('bg-color-picker').addEventListener('input', (e) => {
            document.getElementById('bg-hex-input').value = e.target.value;
            applyBackgroundColor(e.target.value);
        });

        // ---------- 网格识别 (保持不变 增强稳定性)----------
        const refUploader = document.getElementById('ref-uploader');
        const refCanvas = document.getElementById('ref-canvas');
        const refCtx = refCanvas.getContext('2d');
        const sliderSens = document.getElementById('slider-sens');
        const valSens = document.getElementById('val-sens');

        refUploader.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        referenceImg = img;
                        sliderSens.disabled = false;
                        document.getElementById('ref-placeholder').classList.add('hidden');
                        document.getElementById('grid-status-badge').innerHTML = "✓ 已提取";
                        document.getElementById('grid-status-badge').className = "bg-emerald-50 text-emerald-700 text-[10px] px-2 py-0.5 rounded-full font-mono";
                        analyzeAndExtractGrid();
                        showMessage("网格提取完成");
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });
        sliderSens.addEventListener('input', (e) => { valSens.innerText = `${e.target.value}%`; if(referenceImg) analyzeAndExtractGrid(); });

        function analyzeAndExtractGrid() {
            if (!referenceImg) return;
            const w = referenceImg.width, h = referenceImg.height;
            refCanvas.width = 300;
            refCanvas.height = Math.round((h / w) * 300);
            refCtx.drawImage(referenceImg, 0, 0, refCanvas.width, refCanvas.height);
            const cw = refCanvas.width, ch = refCanvas.height;
            const imgData = refCtx.getImageData(0, 0, cw, ch);
            const data = imgData.data;
            const gradX = new Float32Array(cw * ch);
            const gradY = new Float32Array(cw * ch);
            for (let y = 1; y < ch-1; y++) {
                for (let x = 1; x < cw-1; x++) {
                    const idx = (y * cw + x) * 4;
                    const getGray = (i) => (data[i]*0.299 + data[i+1]*0.587 + data[i+2]*0.114);
                    const gx = getGray(idx+4) - getGray(idx-4);
                    const gy = getGray(idx + cw*4) - getGray(idx - cw*4);
                    gradX[y*cw+x] = Math.abs(gx);
                    gradY[y*cw+x] = Math.abs(gy);
                }
            }
            const projX = new Float32Array(cw), projY = new Float32Array(ch);
            for(let x=0; x<cw; x++) { let sum=0; for(let y=0; y<ch; y++) sum += gradX[y*cw+x]; projX[x] = sum/ch; }
            for(let y=0; y<ch; y++) { let sum=0; for(let x=0; x<cw; x++) sum += gradY[y*cw+x]; projY[y] = sum/cw; }
            const sensitivity = parseInt(sliderSens.value)/100;
            function findPeaks(arr, sens) {
                const peaks = [];
                const maxVal = Math.max(...arr);
                const threshold = maxVal * (1 - sens) * 0.4;
                const windowSize = Math.max(4, Math.floor(arr.length * 0.05));
                for (let i=windowSize; i<arr.length-windowSize; i++) {
                    if(arr[i] > threshold) {
                        let isMax = true;
                        for(let w=-windowSize; w<=windowSize; w++) if(arr[i+w] > arr[i]) { isMax=false; break; }
                        if(isMax) { peaks.push(i); i+=windowSize; }
                    }
                }
                return peaks;
            }
            let peaksX = findPeaks(projX, sensitivity);
            let peaksY = findPeaks(projY, sensitivity);
            const mapX = (p) => (p / cw) * 750;
            const mapY = (p) => (p / ch) * 1000;
            let tempX = peaksX.map(mapX), tempY = peaksY.map(mapY);
            gridXCoords = [0, ...tempX, 750].sort((a,b)=>a-b);
            gridYCoords = [0, ...tempY, 1000].sort((a,b)=>a-b);
            const filterCoords = (arr) => { let res=[arr[0]]; for(let i=1;i<arr.length;i++) if(arr[i]-res[res.length-1]>35 || i===arr.length-1) res.push(arr[i]); return res; };
            gridXCoords = filterCoords(gridXCoords);
            gridYCoords = filterCoords(gridYCoords);
            refCtx.drawImage(referenceImg, 0, 0, cw, ch);
            refCtx.lineWidth = 1.2;
            peaksX.forEach(px=>{ refCtx.strokeStyle='#3b82f6'; refCtx.beginPath(); refCtx.moveTo(px,0); refCtx.lineTo(px,ch); refCtx.stroke(); });
            peaksY.forEach(py=>{ refCtx.strokeStyle='#ef4444'; refCtx.beginPath(); refCtx.moveTo(0,py); refCtx.lineTo(cw,py); refCtx.stroke(); });
            generateLayout();
            drawGridLines();
        }

        // 图片上传处理 (完全替换素材库 支持多选)
        function handleMaterialUpload(files) {
            if (!files || files.length === 0) return;
            const validFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
            if (validFiles.length === 0) {
                showMessage("请选择图片文件", true);
                return;
            }
            let loadedCount = 0;
            const newImages = [];
            validFiles.forEach(file => {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    newImages.push(ev.target.result);
                    loadedCount++;
                    if (loadedCount === validFiles.length) {
                        // 替换素材库为用户上传图片
                        uploadedMaterials = newImages;
                        activeImageSources = [...uploadedMaterials];
                        document.getElementById('material-count').innerText = `${activeImageSources.length}张本地素材`;
                        generateLayout();
                        showMessage(`✅ 已加载 ${activeImageSources.length} 张苹果实拍图片`);
                    }
                };
                reader.onerror = () => {
                    loadedCount++;
                    if (loadedCount === validFiles.length && newImages.length===0) showMessage("部分图片加载失败", true);
                };
                reader.readAsDataURL(file);
            });
        }

        // 核心排版引擎 (支持跨域图片 + 灰度缩放)
        function generateLayout() {
            const seed = parseInt(document.getElementById('slider-seed').value);
            document.getElementById('seed-val').innerText = seed;
            const rand = mulberry32(seed);
            const container = document.getElementById('poster-content');
            if(!container) return;
            container.innerHTML = '';
            
            const titleText = document.getElementById('input-title').value || "丰收之味";
            const subtitleText = document.getElementById('input-subtitle').value || "";
            const bodyText = document.getElementById('input-body').value || "";
            const auxLines = document.getElementById('input-aux').value.split('\n').filter(l=>l.trim()!=="");
            const applyGrayscale = document.getElementById('toggle-grayscale').checked;
            // 使用当前活跃素材库（预设或上传）
            const currentImages = activeImageSources.length > 0 ? activeImageSources : APPLE_PRESETS;
            const cols = gridXCoords.length-1, rows = gridYCoords.length-1;
            if(cols<=0 || rows<=0) return;
            
            let occupied = Array.from({length: rows}, ()=>Array(cols).fill(false));
            let itemsToPlace = [];
            const titleW = Math.max(1, Math.min(cols, Math.floor(cols*0.6)));
            const titleH = Math.max(1, Math.min(rows, Math.floor(rows*0.2)));
            itemsToPlace.push({ type:'title', w:titleW, h:titleH, text:titleText });
            const bodyW = Math.max(1, Math.min(cols-1, Math.floor(cols*0.45)));
            const bodyH = Math.max(1, Math.min(rows-1, Math.floor(rows*0.35)));
            itemsToPlace.push({ type:'body', w:bodyW, h:bodyH, text:bodyText });
            // 随机放置多张图片 (基于当前图片库)
            const imgCount = Math.min(currentImages.length, Math.floor(rand() * 3) + 3);
            for(let i=0; i<imgCount; i++) {
                let src = currentImages[i % currentImages.length];
                let w=1, h=1, r=rand();
                if(cols>2 && rows>2){ if(r<0.35){ w=1; h=2; } else if(r<0.65){ w=2; h=2; } }
                itemsToPlace.push({ type:'image', w:Math.min(w,cols), h:Math.min(h,rows), src:src });
            }
            // 色块 & 辅助装饰
            const numColors = Math.max(2, Math.floor(rand()*3)+2);
            for(let i=0;i<numColors;i++) itemsToPlace.push({ type:'color_block', w:1, h:1, color:accentColors[Math.floor(rand()*accentColors.length)] });
            auxLines.forEach(txt=> itemsToPlace.push({ type:'aux_text', w:1, h:1, text:txt, rotate: rand()>0.4 }));
            for(let i=0;i<3;i++) itemsToPlace.push({ type:'decor', w:1, h:1, style: rand()>0.5?'circle':'line' });
            
            itemsToPlace.forEach(item=>{
                let possible=[];
                for(let r=0; r<=rows-item.h; r++){
                    for(let c=0; c<=cols-item.w; c++){
                        let can=true;
                        for(let y=0; y<item.h; y++) for(let x=0; x<item.w; x++) if(occupied[r+y][c+x]) { can=false; break; }
                        if(can) possible.push({r,c});
                    }
                }
                if(possible.length){
                    const chosen = possible[Math.floor(rand()*possible.length)];
                    for(let y=0; y<item.h; y++) for(let x=0; x<item.w; x++) occupied[chosen.r+y][chosen.c+x]=true;
                    const posX = gridXCoords[chosen.c];
                    const posY = gridYCoords[chosen.r];
                    const widthVal = gridXCoords[chosen.c+item.w]-posX;
                    const heightVal = gridYCoords[chosen.r+item.h]-posY;
                    const el = document.createElement('div');
                    el.style.position = 'absolute';
                    el.style.left = `${posX}px`;
                    el.style.top = `${posY}px`;
                    el.style.width = `${widthVal}px`;
                    el.style.height = `${heightVal}px`;
                    el.style.overflow = 'hidden';
                    el.style.boxSizing = 'border-box';
                    
                    if(item.type === 'title'){
                        el.className = "flex flex-col justify-end items-start p-3";
                        el.innerHTML = `<h2 style="font-size:${typoSizes.title}px; line-height:1.05; font-weight:800; letter-spacing:-0.01em; color:#2c2823;" class="break-all">${item.text}</h2><p style="font-size:${typoSizes.subtitle}px; font-weight:500; color:#5c5248;">${subtitleText}</p>`;
                    } 
                    else if(item.type === 'body'){
                        el.className = "flex flex-col justify-start items-start p-3";
                        el.innerHTML = `<p style="font-size:${typoSizes.body}px; font-weight:450; line-height:1.45; color:#3e3a35; text-align:justify;">${item.text}</p>`;
                    }
                    else if(item.type === 'image'){
                        const scalePercent = globalImageScale / 100;
                        const scaleStyle = `transform: scale(${scalePercent}); transform-origin: center center; width:100%; height:100%; object-fit:cover;`;
                        const filterClass = applyGrayscale ? "grayscale contrast-[1.05] brightness-[0.98]" : "";
                        // 创建img元素支持crossorigin (对网络图片有效)
                        const img = document.createElement('img');
                        img.src = item.src;
                        img.style.cssText = scaleStyle;
                        img.className = `w-full h-full object-cover ${filterClass}`;
                        if (item.src.startsWith('http')) img.crossOrigin = "Anonymous";
                        img.onerror = () => { img.src = APPLE_PRESETS[0]; }; // 后备
                        el.appendChild(img);
                    }
                    else if(item.type === 'color_block') el.innerHTML = `<div class="w-full h-full" style="background-color:${item.color}; opacity:0.85;"></div>`;
                    else if(item.type === 'aux_text'){
                        const rotateClass = item.rotate ? "vertical-text rotate-180" : "";
                        el.innerHTML = `<span class="typewriter-font ${rotateClass}" style="font-size:${typoSizes.aux}px; font-weight:600; color:#5f5348;">${item.text}</span>`;
                    }
                    else if(item.type === 'decor'){
                        if(item.style === 'circle') el.innerHTML = `<div style="width:${Math.min(widthVal,heightVal)*0.18}px; height:${Math.min(widthVal,heightVal)*0.18}px; border-radius:50%; border:1.5px solid #b9a48b;"></div>`;
                        else el.innerHTML = `<div style="width:60%; border-bottom:2px solid #d4c3af; margin:auto;"></div>`;
                    }
                    container.appendChild(el);
                }
            });
        }

        function drawGridLines(){
            const gridLayer = document.getElementById('grid-helper-layer');
            if(!gridLayer) return;
            gridLayer.innerHTML = '';
            const showLines = document.getElementById('toggle-grid').checked;
            if(!showLines) return;
            for(let i=1; i<gridYCoords.length-1; i++){
                const line = document.createElement('div');
                line.style.cssText = `position:absolute; left:0; top:${gridYCoords[i]}px; width:750px; height:1px; background-color:rgba(59,130,246,0.5); pointer-events:none;`;
                gridLayer.appendChild(line);
            }
            for(let i=1; i<gridXCoords.length-1; i++){
                const line = document.createElement('div');
                line.style.cssText = `position:absolute; left:${gridXCoords[i]}px; top:0; width:1px; height:1000px; background-color:rgba(239,68,68,0.5); pointer-events:none;`;
                gridLayer.appendChild(line);
            }
            for(let y=1; y<gridYCoords.length-1; y++){
                for(let x=1; x<gridXCoords.length-1; x++){
                    const dot = document.createElement('div');
                    dot.style.cssText = `position:absolute; left:${gridXCoords[x]-3}px; top:${gridYCoords[y]-3}px; width:5px; height:5px; border-radius:50%; background-color:#22c55e; opacity:0.8; z-index:35;`;
                    gridLayer.appendChild(dot);
                }
            }
        }

        // 绑定上传按钮 + 重置预设
        document.getElementById('uploadImgBtn').addEventListener('click', () => {
            document.getElementById('material-uploader').click();
        });
        document.getElementById('material-uploader').addEventListener('change', (e) => {
            if(e.target.files.length) handleMaterialUpload(e.target.files);
            e.target.value = '';
        });
        document.getElementById('resetMaterialBtn').addEventListener('click', resetToApplePreset);
        
        // 各种监听
        document.getElementById('title-font-size').addEventListener('input', (e)=>{ typoSizes.title = parseInt(e.target.value); updateSizeLabels(); generateLayout(); });
        document.getElementById('subtitle-font-size').addEventListener('input', (e)=>{ typoSizes.subtitle = parseInt(e.target.value); updateSizeLabels(); generateLayout(); });
        document.getElementById('body-font-size').addEventListener('input', (e)=>{ typoSizes.body = parseInt(e.target.value); updateSizeLabels(); generateLayout(); });
        document.getElementById('aux-font-size').addEventListener('input', (e)=>{ typoSizes.aux = parseInt(e.target.value); updateSizeLabels(); generateLayout(); });
        document.getElementById('image-scale-slider').addEventListener('input', (e)=>{ globalImageScale = parseInt(e.target.value); document.getElementById('img-scale-val').innerText = globalImageScale+'%'; generateLayout(); });
        document.getElementById('slider-seed').addEventListener('input', (e)=>{ document.getElementById('seed-val').innerText = e.target.value; generateLayout(); drawGridLines(); });
        ['input-title','input-subtitle','input-body','input-aux','toggle-grayscale'].forEach(id => document.getElementById(id).addEventListener('input', generateLayout));
        document.getElementById('toggle-grid').addEventListener('change', drawGridLines);
        
        async function exportPoster() {
            const node = document.getElementById('poster-root');
            try {
                const dataUrl = await htmlToImage.toPng(node, { quality:0.98, pixelRatio:2, width:750, height:1000 });
                const link = document.createElement('a');
                link.download = `apple-swiss-poster-${Date.now()}.png`;
                link.href = dataUrl;
                link.click();
                showMessage("🍎 海报导出成功");
            } catch(e){ console.warn(e); showMessage("导出可能因跨域受限，请使用本地图片后重试", true); }
        }
        function resizePreview(){ const root=document.getElementById('poster-root'); if(root?.parentElement) root.style.transform = `scale(${Math.min(root.parentElement.clientWidth/750,1)})`; }
        window.addEventListener('resize', resizePreview);
        window.onload = () => { resetToDefault(); resizePreview(); };
    </script>
</body>
